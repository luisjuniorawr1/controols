<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JPG PNG WebP format comparison visual</title>
  <desc id="desc">Three file cards labeled JPG, PNG and WebP with different visual treatments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a20"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="photoA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7a1a"/><stop offset=".52" stop-color="#8b4218"/><stop offset="1" stop-color="#242a32"/></linearGradient>
    <linearGradient id="photoB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebedf0"/><stop offset=".5" stop-color="#6f7782"/><stop offset="1" stop-color="#20242b"/></linearGradient>
    <linearGradient id="photoC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9148"/><stop offset=".45" stop-color="#be5d20"/><stop offset="1" stop-color="#151a20"/></linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#22272e"/><rect width="12" height="12" fill="#343a43"/><rect x="12" y="12" width="12" height="12" fill="#343a43"/></pattern>
    <radialGradient id="glow"><stop stop-color="#ff7a1a" stop-opacity=".28"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="380" fill="url(#glow)" opacity=".45"/>
  <g transform="translate(92 126)">
    <g transform="rotate(-3 155 190)">
      <rect width="300" height="380" rx="30" fill="#111419" stroke="#353b44" stroke-width="2"/>
      <rect x="26" y="26" width="248" height="230" rx="21" fill="url(#photoA)"/>
      <path d="M48 225l62-73 47 46 44-56 51 83" fill="none" stroke="#fff" stroke-opacity=".74" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="220" cy="80" r="22" fill="#fff" fill-opacity=".72"/>
      <text x="28" y="326" fill="#f4f6f8" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">JPG</text>
      <rect x="197" y="297" width="74" height="12" rx="6" fill="#ff7a1a" opacity=".7"/><rect x="197" y="321" width="50" height="8" rx="4" fill="#737b86"/>
    </g>
    <g transform="translate(356 -18)">
      <rect width="300" height="416" rx="30" fill="#111419" stroke="#5d4738" stroke-width="2"/>
      <rect x="26" y="26" width="248" height="256" rx="21" fill="url(#checker)"/>
      <path d="M54 245l56-67 45 45 45-68 49 90z" fill="url(#photoB)" stroke="#cfd3d8" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="215" cy="82" r="24" fill="#ff7a1a"/>
      <text x="28" y="356" fill="#ff9147" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">PNG</text>
      <rect x="197" y="327" width="74" height="12" rx="6" fill="#ff7a1a" opacity=".7"/><rect x="197" y="351" width="50" height="8" rx="4" fill="#737b86"/>
    </g>
    <g transform="translate(714 10) rotate(3 155 190)">
      <rect width="300" height="380" rx="30" fill="#111419" stroke="#353b44" stroke-width="2"/>
      <rect x="26" y="26" width="248" height="230" rx="21" fill="url(#photoC)"/>
      <path d="M48 225l62-73 47 46 44-56 51 83" fill="none" stroke="#fff" stroke-opacity=".74" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="220" cy="80" r="22" fill="#fff" fill-opacity=".72"/>
      <text x="28" y="326" fill="#f4f6f8" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">WebP</text>
      <rect x="197" y="297" width="74" height="12" rx="6" fill="#ff7a1a" opacity=".7"/><rect x="197" y="321" width="50" height="8" rx="4" fill="#737b86"/>
    </g>
  </g>
  <g opacity=".45" fill="#ff7a1a"><circle cx="569" cy="548" r="5"/><circle cx="594" cy="548" r="5"/><circle cx="619" cy="548" r="5"/></g>
</svg>