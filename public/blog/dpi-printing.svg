<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">72 DPI 150 DPI 300 DPI printing visual</title>
  <desc id="desc">Three pixel density samples beside a print sheet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17191e"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff7a1a" stop-opacity=".30"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <pattern id="g72" width="34" height="34" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="24" height="24" rx="5" fill="#ff7a1a" opacity=".65"/></pattern>
    <pattern id="g150" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="13" height="13" rx="3" fill="#ff9147" opacity=".72"/></pattern>
    <pattern id="g300" width="11" height="11" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="7" height="7" rx="2" fill="#ff9d61" opacity=".82"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="260" fill="url(#glow)"/>
  <g transform="translate(92 128)">
    <g>
      <rect width="245" height="294" rx="26" fill="#101318" stroke="#30363e" stroke-width="2"/>
      <rect x="24" y="24" width="197" height="190" rx="18" fill="url(#g72)"/>
      <text x="28" y="261" fill="#f4f6f8" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">72 DPI</text>
    </g>
    <g transform="translate(276)">
      <rect width="245" height="294" rx="26" fill="#101318" stroke="#3e3833" stroke-width="2"/>
      <rect x="24" y="24" width="197" height="190" rx="18" fill="url(#g150)"/>
      <text x="28" y="261" fill="#f4f6f8" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">150 DPI</text>
    </g>
    <g transform="translate(552)">
      <rect width="245" height="294" rx="26" fill="#111419" stroke="#70482d" stroke-width="2"/>
      <rect x="24" y="24" width="197" height="190" rx="18" fill="url(#g300)"/>
      <text x="28" y="261" fill="#ff9147" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">300 DPI</text>
    </g>
  </g>
  <g transform="translate(922 145) rotate(5)">
    <rect x="12" y="16" width="188" height="276" rx="18" fill="#000" opacity=".28"/>
    <rect width="188" height="276" rx="18" fill="#f3efe9"/>
    <rect x="30" y="36" width="128" height="96" rx="12" fill="#191d23"/>
    <circle cx="126" cy="70" r="18" fill="#ff7a1a"/>
    <path d="M38 118l40-40 27 27 25-30 28 43" fill="none" stroke="#ded7ce" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#9d9389"><rect x="30" y="160" width="128" height="9" rx="4"/><rect x="30" y="184" width="96" height="9" rx="4"/><rect x="30" y="208" width="115" height="9" rx="4"/></g>
  </g>
  <path d="M86 472H846" stroke="#59616b" stroke-width="2" stroke-dasharray="7 11" opacity=".55"/>
  <g fill="#ff7a1a"><circle cx="94" cy="472" r="5"/><circle cx="337" cy="472" r="5"/><circle cx="613" cy="472" r="5"/><circle cx="837" cy="472" r="5"/></g>
</svg>