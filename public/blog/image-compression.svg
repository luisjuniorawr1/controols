<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JPG image compression visual</title>
  <desc id="desc">A large JPG file card becomes a smaller compressed file card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16191f"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7a1a"/><stop offset=".45" stop-color="#7b3e19"/><stop offset="1" stop-color="#20252d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff7a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="955" cy="88" r="250" fill="url(#glow)"/>
  <circle cx="183" cy="560" r="200" fill="#ff7a1a" opacity=".05" filter="url(#blur)"/>
  <g opacity=".22" stroke="#69727d"><path d="M0 520H1200"/><path d="M0 104H1200"/><path d="M135 0V630"/><path d="M1064 0V630"/></g>
  <g transform="translate(155 135)">
    <rect width="350" height="360" rx="34" fill="#11151b" stroke="#343b44" stroke-width="2"/>
    <rect x="28" y="28" width="294" height="205" rx="24" fill="url(#photo)"/>
    <path d="M55 201l73-76 47 49 50-59 70 86" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="251" cy="82" r="21" fill="#fff" fill-opacity=".72"/>
    <text x="30" y="286" fill="#ff9147" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">JPG</text>
    <text x="30" y="329" fill="#f4f6f8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">5 MB</text>
  </g>
  <g transform="translate(540 255)" stroke="#ff8b3c" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 55h115"/><path d="M82 22l33 33-33 33"/>
  </g>
  <g transform="translate(700 185)">
    <rect width="330" height="270" rx="34" fill="#11151b" stroke="#6b4a34" stroke-width="2"/>
    <rect x="28" y="28" width="274" height="145" rx="22" fill="url(#photo)"/>
    <path d="M52 151l61-60 41 38 46-48 72 70" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="239" cy="66" r="16" fill="#fff" fill-opacity=".72"/>
    <text x="28" y="220" fill="#ff9147" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800">JPG</text>
    <text x="190" y="220" fill="#f4f6f8" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">820 KB</text>
  </g>
  <g transform="translate(866 480)"><rect width="164" height="44" rx="22" fill="#ff7a1a" fill-opacity=".12" stroke="#ff7a1a" stroke-opacity=".42"/><circle cx="28" cy="22" r="7" fill="#ff7a1a"/><circle cx="52" cy="22" r="5" fill="#ff7a1a" opacity=".6"/><circle cx="72" cy="22" r="3" fill="#ff7a1a" opacity=".35"/></g>
</svg>