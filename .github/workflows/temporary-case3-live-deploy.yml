name: Temporary Verified Case 003 Live Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Confirm restored Case 003 files in build source
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            3b4f4ca7a8a7e567611415f3f3b185a01dbdc831
            df2158fb102585d2fe36f8a849f3576ec1e7f2b8
            f24d55ce5f61a3def09fc396304da5554f4d3861
            3e7b35d4394edd4f96248fe0752e1c2bdaa2242f
            1c2c75b2641456b2cc1edb9bbeab9675115d8b32
            25bfdd48146fcedb94a3c4ae830e5505d6ef2241
            8f5ba0768157a9ccbf43d8e93812bfe8701f4ef5
            d6c70760cc26755286e65f0b92fddb502799c231
          )
          files=(
            00_capa_link_fantasma.png
            01_luna_link_suspeito.png
            02_maya_pistas_link.png
            03_endereco_suspeito.png
            04_nina_caminho_oficial.png
            05_caio_pagina_pede_codigo.png
            06_luna_mapa_link_seguro.png
            07_final_link_desmascarado.png
          )
          for i in "${!files[@]}"; do
            actual="$(git hash-object "public/game/assets/case-003/${files[$i]}")"
            echo "${files[$i]} source=$actual expected=${expected[$i]}"
            test "$actual" = "${expected[$i]}"
          done
      - name: Confirm Firebase credentials
        run: test -n "$FIREBASE_SERVICE_ACCOUNT"
      - name: Deploy corrected Case 003 to Firebase live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: controols
      - name: Verify all eight assets on controols.com
        shell: bash
        run: |
          set -euo pipefail
          files=(
            00_capa_link_fantasma.png
            01_luna_link_suspeito.png
            02_maya_pistas_link.png
            03_endereco_suspeito.png
            04_nina_caminho_oficial.png
            05_caio_pagina_pede_codigo.png
            06_luna_mapa_link_seguro.png
            07_final_link_desmascarado.png
          )
          expected=(
            3b4f4ca7a8a7e567611415f3f3b185a01dbdc831
            df2158fb102585d2fe36f8a849f3576ec1e7f2b8
            f24d55ce5f61a3def09fc396304da5554f4d3861
            3e7b35d4394edd4f96248fe0752e1c2bdaa2242f
            1c2c75b2641456b2cc1edb9bbeab9675115d8b32
            25bfdd48146fcedb94a3c4ae830e5505d6ef2241
            8f5ba0768157a9ccbf43d8e93812bfe8701f4ef5
            d6c70760cc26755286e65f0b92fddb502799c231
          )
          for attempt in $(seq 1 20); do
            all_ok=1
            echo "Verification attempt $attempt"
            for i in "${!files[@]}"; do
              file="${files[$i]}"
              curl -fsSL "https://controols.com/game/assets/case-003/${file}?v4-20260817&verify=${attempt}-$(date +%s%N)" -o "/tmp/${file}"
              actual="$(git hash-object "/tmp/${file}")"
              echo "$file live=$actual expected=${expected[$i]}"
              if [[ "$actual" != "${expected[$i]}" ]]; then all_ok=0; fi
            done
            if [[ "$all_ok" == "1" ]]; then
              echo "All eight restored Case 003 assets are live."
              exit 0
            fi
            sleep 10
          done
          exit 1
