name: CONTROOLZ TCG PR checks

on:
  pull_request:
    paths:
      - "src/tcg/**"
      - "app/play/**"
      - "tests/tcg-*.spec.ts"
      - "playwright.tcg.config.ts"
      - "package.json"
      - ".github/workflows/tcg-pr.yml"
  workflow_dispatch:

concurrency:
  group: tcg-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tcg-typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        run: npm run lint
      - name: TCG engine tests
        run: npm run qa:tcg
      - name: Static build
        run: npm run build
