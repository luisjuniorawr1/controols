name: Horizontal Homepage QA

on:
  push:
    branches: [agent/horizontal-home]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify horizontal navigation and one-screen panels
        run: |
          python3 -m http.server 4173 --directory out >/tmp/controols-horizontal.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .5
          done
          node - <<'NODE'
          const { chromium } = require('playwright');

          async function verifyViewport(browser, width, height) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const initial = await page.evaluate(() => {
              const track = document.querySelector('.marketing-horizontal-track');
              const panels = [...document.querySelectorAll('.marketing-horizontal-panel')];
              return {
                scrollY,
                count: panels.length,
                trackWidth: track?.clientWidth ?? 0,
                trackScrollWidth: track?.scrollWidth ?? 0,
                bodyHeight: document.documentElement.scrollHeight,
                innerHeight,
                panels: panels.map(panel => ({
                  id: panel.id,
                  clientHeight: panel.clientHeight,
                  scrollHeight: panel.scrollHeight,
                  width: panel.getBoundingClientRect().width,
                })),
              };
            });
            if (initial.count !== 6) throw new Error(`Expected 6 panels at ${width}x${height}: ${JSON.stringify(initial)}`);
            if (initial.trackScrollWidth < initial.trackWidth * 5.9) throw new Error(`Horizontal track too short: ${JSON.stringify(initial)}`);
            if (initial.bodyHeight > height + 2) throw new Error(`Document has vertical overflow at ${width}x${height}: ${JSON.stringify(initial)}`);
            for (const panel of initial.panels) {
              if (panel.scrollHeight > panel.clientHeight + 2) throw new Error(`Panel ${panel.id} overflows vertically at ${width}x${height}: ${JSON.stringify(panel)}`);
              if (Math.abs(panel.width - width) > 2) throw new Error(`Panel ${panel.id} is not one viewport wide: ${JSON.stringify(panel)}`);
            }

            await page.mouse.wheel(0, 650);
            await page.waitForTimeout(250);
            const afterWheel = await page.evaluate(() => ({
              scrollY,
              left: document.querySelector('.marketing-horizontal-track')?.scrollLeft ?? 0,
            }));
            if (afterWheel.scrollY !== 0) throw new Error(`Wheel created vertical scroll at ${width}x${height}: ${JSON.stringify(afterWheel)}`);
            if (afterWheel.left < 100) throw new Error(`Wheel did not move horizontally at ${width}x${height}: ${JSON.stringify(afterWheel)}`);

            await page.evaluate(() => document.querySelector('.marketing-horizontal-track')?.scrollTo({ left: 0, behavior: 'instant' }));
            await page.waitForTimeout(100);
            await page.mouse.move(Math.round(width * .72), Math.round(height * .55));
            await page.mouse.down();
            await page.mouse.move(Math.round(width * .25), Math.round(height * .55), { steps: 8 });
            await page.mouse.up();
            await page.waitForTimeout(300);
            const afterDrag = await page.evaluate(() => document.querySelector('.marketing-horizontal-track')?.scrollLeft ?? 0);
            if (afterDrag < 100) throw new Error(`Mouse drag did not move horizontally at ${width}x${height}: ${afterDrag}`);

            await page.screenshot({ path: `horizontal-home-${width}x${height}.png` });
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await verifyViewport(browser, 1440, 900);
            await verifyViewport(browser, 390, 844);
            await verifyViewport(browser, 390, 700);

            const game = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await game.goto('http://127.0.0.1:4173/pt/', { waitUntil: 'networkidle' });
            await game.mouse.wheel(0, 500);
            await game.waitForTimeout(150);
            const gameState = await game.evaluate(() => ({ scrollY, horizontalTrack: !!document.querySelector('.marketing-horizontal-track') }));
            if (gameState.scrollY !== 0 || gameState.horizontalTrack) throw new Error(`Game route inherited homepage scrolling: ${JSON.stringify(gameState)}`);
            await game.close();
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizontal-home-qa
          path: horizontal-home-*.png
