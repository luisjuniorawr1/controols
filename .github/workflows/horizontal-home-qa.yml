name: Horizontal Homepage QA

on:
  push:
    branches: [agent/horizontal-home]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify horizontal navigation and one-screen panels
        run: |
          python3 -m http.server 4173 --directory out >/tmp/controols-horizontal.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .5; done
          node - <<'NODE'
          const { chromium } = require('playwright');

          async function assertLayout(page, width, height) {
            const state = await page.evaluate(() => {
              const track = document.querySelector('.marketing-horizontal-track');
              const panels = [...document.querySelectorAll('.marketing-horizontal-panel')];
              return {
                scrollY,
                count: panels.length,
                trackWidth: track?.clientWidth ?? 0,
                trackScrollWidth: track?.scrollWidth ?? 0,
                bodyHeight: document.documentElement.scrollHeight,
                innerHeight,
                panels: panels.map(panel => ({ id: panel.id, clientHeight: panel.clientHeight, scrollHeight: panel.scrollHeight, width: panel.getBoundingClientRect().width })),
              };
            });
            if (state.count !== 6) throw new Error(`Expected 6 panels at ${width}x${height}: ${JSON.stringify(state)}`);
            if (state.trackScrollWidth < state.trackWidth * 5.9) throw new Error(`Horizontal track too short: ${JSON.stringify(state)}`);
            if (state.bodyHeight > height + 2) throw new Error(`Document has vertical overflow at ${width}x${height}: ${JSON.stringify(state)}`);
            for (const panel of state.panels) {
              if (panel.scrollHeight > panel.clientHeight + 2) throw new Error(`Panel ${panel.id} overflows vertically at ${width}x${height}: ${JSON.stringify(panel)}`);
              if (Math.abs(panel.width - width) > 2) throw new Error(`Panel ${panel.id} is not one viewport wide: ${JSON.stringify(panel)}`);
            }
          }

          async function capturePanels(page, prefix) {
            for (let index = 0; index < 6; index++) {
              await page.evaluate(index => {
                const track = document.querySelector('.marketing-horizontal-track');
                if (!track) return;
                track.style.scrollBehavior = 'auto';
                track.scrollLeft = index * track.clientWidth;
              }, index);
              await page.waitForTimeout(100);
              await page.screenshot({ path: `${prefix}-panel-${index + 1}.png` });
            }
          }

          async function verifyInteractions(page, width, height) {
            await page.evaluate(() => { const track = document.querySelector('.marketing-horizontal-track'); if (track) { track.style.removeProperty('scroll-behavior'); track.scrollLeft = 0; } });
            await page.waitForTimeout(100);
            await page.mouse.wheel(0, 650);
            await page.waitForTimeout(350);
            const wheel = await page.evaluate(() => ({ scrollY, left: document.querySelector('.marketing-horizontal-track')?.scrollLeft ?? 0 }));
            if (wheel.scrollY !== 0 || wheel.left < 100) throw new Error(`Wheel failed at ${width}x${height}: ${JSON.stringify(wheel)}`);

            await page.evaluate(() => { const track = document.querySelector('.marketing-horizontal-track'); if (track) { track.style.scrollBehavior = 'auto'; track.scrollLeft = 0; track.style.removeProperty('scroll-behavior'); } });
            await page.waitForTimeout(150);
            await page.mouse.move(Math.round(width * .72), Math.round(height * .55));
            await page.mouse.down();
            await page.mouse.move(Math.round(width * .25), Math.round(height * .55), { steps: 8 });
            await page.mouse.up();
            await page.waitForTimeout(250);
            const drag = await page.evaluate(() => document.querySelector('.marketing-horizontal-track')?.scrollLeft ?? 0);
            if (drag < 100) throw new Error(`Mouse drag failed at ${width}x${height}: ${drag}`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await desktop.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await assertLayout(desktop, 1440, 900);
            await capturePanels(desktop, 'desktop');
            await verifyInteractions(desktop, 1440, 900);
            await desktop.close();

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await assertLayout(mobile, 390, 844);
            await capturePanels(mobile, 'mobile');
            await mobile.close();

            const shortMobile = await browser.newPage({ viewport: { width: 390, height: 700 }, hasTouch: true, isMobile: true });
            await shortMobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await assertLayout(shortMobile, 390, 700);
            await shortMobile.screenshot({ path: 'mobile-short-hero.png' });
            await shortMobile.close();

            const game = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await game.goto('http://127.0.0.1:4173/pt/', { waitUntil: 'networkidle' });
            await game.mouse.wheel(0, 500);
            await game.waitForTimeout(150);
            const gameState = await game.evaluate(() => ({ scrollY, horizontalTrack: !!document.querySelector('.marketing-horizontal-track') }));
            if (gameState.scrollY !== 0 || gameState.horizontalTrack) throw new Error(`Game route inherited homepage navigation: ${JSON.stringify(gameState)}`);
            await game.close();

            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizontal-home-qa
          path: |
            desktop-panel-*.png
            mobile-panel-*.png
            mobile-short-hero.png
