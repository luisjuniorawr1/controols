name: Case 003 Asset Bridge

on:
  push:
    branches: [feature/case003-link-fantasma]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Drive auth helper
        run: python -m pip install --quiet google-auth requests
      - name: Download Case 003 masters from Drive
        run: |
          python - <<'PY'
          import json, os, pathlib, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          print('SERVICE_ACCOUNT_EMAIL=' + info['client_email'])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/drive.readonly'],
          )
          creds.refresh(Request())
          file_id = '1k7IVN86hOVoWA7fW1KpscfmMRbTkRUpC'
          url = f'https://www.googleapis.com/drive/v3/files/{file_id}?alt=media'
          response = requests.get(url, headers={'Authorization': f'Bearer {creds.token}'}, timeout=120)
          print('DRIVE_STATUS=' + str(response.status_code))
          response.raise_for_status()
          pathlib.Path('/tmp/case003.zip').write_bytes(response.content)
          print('DOWNLOADED_BYTES=' + str(len(response.content)))
          PY
      - name: Extract and validate masters
        run: |
          rm -rf /tmp/case003-extract public/game/assets/case-003
          mkdir -p /tmp/case003-extract public/game/assets/case-003
          unzip -q /tmp/case003.zip -d /tmp/case003-extract
          cp /tmp/case003-extract/controols-case003-assets/scenes/*.png public/game/assets/case-003/
          python - <<'PY'
          from pathlib import Path
          import struct
          folder = Path('public/game/assets/case-003')
          paths = sorted(folder.glob('*.png'))
          assert len(paths) == 8, f'Expected 8 Case 003 PNGs, got {len(paths)}'
          for path in paths:
              raw = path.read_bytes()[:24]
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == (1672, 941), (path, width, height)
              print(path.name, width, height)
          PY
      - name: Commit Case 003 masters
        run: |
          if git diff --quiet -- public/game/assets/case-003; then
            echo "Assets already committed"
          else
            git config user.name "controols-assets-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/game/assets/case-003
            git commit -m "Add Case 003 Link Fantasma artwork"
            git push origin HEAD:feature/case003-link-fantasma
          fi
# Drive access granted to the Firebase service account; retry import.
