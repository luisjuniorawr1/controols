name: Super 001 PR Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/super-001-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire Super 001
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/game/kidsStory.ts')
          s = p.read_text()
          if "'super-001'" not in s.split('export type KidsGameId =',1)[1].split(';',1)[0]:
              s = s.replace("export type KidsGameId = 'case-002' | 'case-004' | 'case-005' | 'case-006';", "export type KidsGameId = 'super-001' | 'case-002' | 'case-004' | 'case-005' | 'case-006';")
          if 'export const superKidsStory' not in s:
              anchor = "export const kidsGames = [sixthKidsStory, fifthKidsStory, fourthKidsStory, secondKidsStory] as const;"
              block = '''export const superKidsStory = {
            id: 'super-001' as KidsGameId,
            number: 'SUPER 001',
            title: 'A Cidade que Ficou no Escuro',
            subtitle: 'Uma grande missão sobre energia, prioridades, segurança e trabalho em equipe.',
            age: '5–10 anos',
            accent: '#f6bd22',
            cover: '/game/assets/super-001/00_capa_cidade_no_escuro.png',
            scenes: {
              blackout: '/game/assets/super-001/01_clubhouse_apagao.png',
              lantern: '/game/assets/super-001/02_nina_lanterna.png',
              cable: '/game/assets/super-001/03_nina_fio_caido.png',
              backpack: '/game/assets/super-001/04_nina_mochila.png',
              map: '/game/assets/super-001/05_theo_mapa_energia.png',
              interruption: '/game/assets/super-001/06_theo_caminho_interrompido.png',
              objects: '/game/assets/super-001/07_theo_objetos_energia.png',
              priorities: '/game/assets/super-001/08_maya_mapa_prioridades.png',
              priorityChoice: '/game/assets/super-001/09_maya_escolha_prioridades.png',
              waste: '/game/assets/super-001/10_caio_caca_desperdicio.png',
              reserve: '/game/assets/super-001/11_caio_reserva_energia.png',
              neighborhood: '/game/assets/super-001/12_luna_bairro_apagado.png',
              team: '/game/assets/super-001/13_luna_monte_equipe.png',
              plan: '/game/assets/super-001/14_plano_da_luz.png',
              lighting: '/game/assets/super-001/15_cidade_acendendo.png',
              ending: '/game/assets/super-001/16_final_cidade_iluminada.png',
            },
          } as const;

          export const super001Assets = [superKidsStory.cover, ...Object.values(superKidsStory.scenes)];

          export const kidsGames = [superKidsStory, sixthKidsStory, fifthKidsStory, fourthKidsStory, secondKidsStory] as const;'''
              assert anchor in s
              s = s.replace(anchor, block)
          p.write_text(s)

          p = Path('src/components/KidsStoryPrototype.tsx')
          s = p.read_text()
          if 'super001Assets' not in s:
              s = s.replace("  case006Assets,\n", "  case006Assets,\n  super001Assets,\n")
          if 'superKidsStory,' not in s:
              s = s.replace("  sixthKidsStory,\n", "  sixthKidsStory,\n  superKidsStory,\n")
          if "import Super001Game" not in s:
              s = s.replace("} from '@/src/game/kidsStory';\n", "} from '@/src/game/kidsStory';\nimport Super001Game from '@/src/components/Super001Game';\n", 1)
          s = s.replace("const [featuredId, setFeaturedId] = useState<KidsGameId>('case-006');", "const [featuredId, setFeaturedId] = useState<KidsGameId>('super-001');")
          s = s.replace("const featuredLabel = featuredId === 'case-006' ? 'NOVA AVENTURA' : featuredId === 'case-002' ? 'HISTÓRIA REFERÊNCIA' : 'AVENTURA CONTROOLS';", "const featuredLabel = featuredId === 'super-001' ? 'SUPER AVENTURA' : featuredId === 'case-006' ? 'NOVA AVENTURA' : featuredId === 'case-002' ? 'HISTÓRIA REFERÊNCIA' : 'AVENTURA CONTROOLS';")
          s = s.replace("<span><small>{story.id === 'case-006' ? 'NOVA' : story.id === 'case-002' ? 'REFERÊNCIA' : 'AVENTURA'}</small><b>{story.title}</b></span>", "<span><small>{story.id === 'super-001' ? 'SUPER AVENTURA' : story.id === 'case-006' ? 'NOVA' : story.id === 'case-002' ? 'REFERÊNCIA' : 'AVENTURA'}</small><b>{story.title}</b></span>")
          s = s.replace("const activeStory = gameId === 'case-006' ? sixthKidsStory : gameId === 'case-005' ? fifthKidsStory : gameId === 'case-004' ? fourthKidsStory : secondKidsStory;", "const activeStory = gameId === 'super-001' ? superKidsStory : gameId === 'case-006' ? sixthKidsStory : gameId === 'case-005' ? fifthKidsStory : gameId === 'case-004' ? fourthKidsStory : secondKidsStory;")
          s = s.replace("const activeAssets = gameId === 'case-006' ? case006Assets : gameId === 'case-005' ? case005Assets : gameId === 'case-004' ? case004Assets : case002Assets;", "const activeAssets = gameId === 'super-001' ? super001Assets : gameId === 'case-006' ? case006Assets : gameId === 'case-005' ? case005Assets : gameId === 'case-004' ? case004Assets : case002Assets;")
          s = s.replace("{mode === 'playing' && (gameId === 'case-006' ? <Case006Game onExit={exitGame} /> : gameId === 'case-005' ? <Case005Game onExit={exitGame} /> : gameId === 'case-004' ? <Case004Game onExit={exitGame} /> : <Case002Game onExit={exitGame} />)}", "{mode === 'playing' && (gameId === 'super-001' ? <Super001Game onExit={exitGame} /> : gameId === 'case-006' ? <Case006Game onExit={exitGame} /> : gameId === 'case-005' ? <Case005Game onExit={exitGame} /> : gameId === 'case-004' ? <Case004Game onExit={exitGame} /> : <Case002Game onExit={exitGame} />)}")
          p.write_text(s)
          PY
      - name: Validate 17 masters
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          paths=sorted(Path('public/game/assets/super-001').glob('*.png'))
          assert len(paths)==17
          for p in paths:
              raw=p.read_bytes()[:24]
              assert raw[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',raw[16:24])==(1672,941)
          PY
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Commit playable adventure
        shell: bash
        run: |
          set -euo pipefail
          git add src/game/kidsStory.ts src/components/KidsStoryPrototype.tsx src/components/Super001Game.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[super-001-code] Make Super 001 playable"
          git push origin HEAD:agent/super-001-assets
