name: Temporary Super 001 Implementation QA

on:
  push:
    branches: [agent/super-001-assets]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-qa:
    if: ${{ !contains(github.event.head_commit.message, '[super-001-code]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/super-001-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire Super 001 into story data and library
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          data_path = Path('src/game/kidsStory.ts')
          data = data_path.read_text()
          data = data.replace(
              "export type KidsGameId = 'case-002' | 'case-004' | 'case-005' | 'case-006';",
              "export type KidsGameId = 'super-001' | 'case-002' | 'case-004' | 'case-005' | 'case-006';"
          )
          anchor = "export const kidsGames = [sixthKidsStory, fifthKidsStory, fourthKidsStory, secondKidsStory] as const;"
          assert anchor in data, 'kidsGames anchor not found'
          super_story = '''export const superKidsStory = {
            id: 'super-001' as KidsGameId,
            number: 'SUPER 001',
            title: 'A Cidade que Ficou no Escuro',
            subtitle: 'Uma grande missão sobre energia, prioridades, segurança e trabalho em equipe.',
            age: '5–10 anos',
            accent: '#f6bd22',
            cover: '/game/assets/super-001/00_capa_cidade_no_escuro.png',
            scenes: {
              blackout: '/game/assets/super-001/01_clubhouse_apagao.png',
              lantern: '/game/assets/super-001/02_nina_lanterna.png',
              cable: '/game/assets/super-001/03_nina_fio_caido.png',
              backpack: '/game/assets/super-001/04_nina_mochila.png',
              map: '/game/assets/super-001/05_theo_mapa_energia.png',
              interruption: '/game/assets/super-001/06_theo_caminho_interrompido.png',
              objects: '/game/assets/super-001/07_theo_objetos_energia.png',
              priorities: '/game/assets/super-001/08_maya_mapa_prioridades.png',
              priorityChoice: '/game/assets/super-001/09_maya_escolha_prioridades.png',
              waste: '/game/assets/super-001/10_caio_caca_desperdicio.png',
              reserve: '/game/assets/super-001/11_caio_reserva_energia.png',
              neighborhood: '/game/assets/super-001/12_luna_bairro_apagado.png',
              team: '/game/assets/super-001/13_luna_monte_equipe.png',
              plan: '/game/assets/super-001/14_plano_da_luz.png',
              lighting: '/game/assets/super-001/15_cidade_acendendo.png',
              ending: '/game/assets/super-001/16_final_cidade_iluminada.png',
            },
          } as const;

          export const super001Assets = [superKidsStory.cover, ...Object.values(superKidsStory.scenes)];

          export const kidsGames = [superKidsStory, sixthKidsStory, fifthKidsStory, fourthKidsStory, secondKidsStory] as const;'''
          data = data.replace(anchor, super_story)
          data_path.write_text(data)

          component_path = Path('src/components/KidsStoryPrototype.tsx')
          component = component_path.read_text()
          component = component.replace("  case006Assets,\n", "  case006Assets,\n  super001Assets,\n")
          component = component.replace("  sixthKidsStory,\n", "  sixthKidsStory,\n  superKidsStory,\n")
          import_anchor = "} from '@/src/game/kidsStory';\n"
          assert import_anchor in component, 'game import anchor not found'
          component = component.replace(import_anchor, import_anchor + "import Super001Game from '@/src/components/Super001Game';\n", 1)
          component = component.replace("const [featuredId, setFeaturedId] = useState<KidsGameId>('case-006');", "const [featuredId, setFeaturedId] = useState<KidsGameId>('super-001');")
          old_label = "const featuredLabel = featuredId === 'case-006' ? 'NOVA AVENTURA' : featuredId === 'case-002' ? 'HISTÓRIA REFERÊNCIA' : 'AVENTURA CONTROOLS';"
          new_label = "const featuredLabel = featuredId === 'super-001' ? 'SUPER AVENTURA' : featuredId === 'case-006' ? 'NOVA AVENTURA' : featuredId === 'case-002' ? 'HISTÓRIA REFERÊNCIA' : 'AVENTURA CONTROOLS';"
          assert old_label in component, 'featured label anchor not found'
          component = component.replace(old_label, new_label)
          old_tile = "<span><small>{story.id === 'case-006' ? 'NOVA' : story.id === 'case-002' ? 'REFERÊNCIA' : 'AVENTURA'}</small><b>{story.title}</b></span>"
          new_tile = "<span><small>{story.id === 'super-001' ? 'SUPER AVENTURA' : story.id === 'case-006' ? 'NOVA' : story.id === 'case-002' ? 'REFERÊNCIA' : 'AVENTURA'}</small><b>{story.title}</b></span>"
          assert old_tile in component, 'catalog label anchor not found'
          component = component.replace(old_tile, new_tile)
          old_story = "const activeStory = gameId === 'case-006' ? sixthKidsStory : gameId === 'case-005' ? fifthKidsStory : gameId === 'case-004' ? fourthKidsStory : secondKidsStory;"
          new_story = "const activeStory = gameId === 'super-001' ? superKidsStory : gameId === 'case-006' ? sixthKidsStory : gameId === 'case-005' ? fifthKidsStory : gameId === 'case-004' ? fourthKidsStory : secondKidsStory;"
          assert old_story in component, 'active story anchor not found'
          component = component.replace(old_story, new_story)
          old_assets = "const activeAssets = gameId === 'case-006' ? case006Assets : gameId === 'case-005' ? case005Assets : gameId === 'case-004' ? case004Assets : case002Assets;"
          new_assets = "const activeAssets = gameId === 'super-001' ? super001Assets : gameId === 'case-006' ? case006Assets : gameId === 'case-005' ? case005Assets : gameId === 'case-004' ? case004Assets : case002Assets;"
          assert old_assets in component, 'active assets anchor not found'
          component = component.replace(old_assets, new_assets)
          old_play = "{mode === 'playing' && (gameId === 'case-006' ? <Case006Game onExit={exitGame} /> : gameId === 'case-005' ? <Case005Game onExit={exitGame} /> : gameId === 'case-004' ? <Case004Game onExit={exitGame} /> : <Case002Game onExit={exitGame} />)}"
          new_play = "{mode === 'playing' && (gameId === 'super-001' ? <Super001Game onExit={exitGame} /> : gameId === 'case-006' ? <Case006Game onExit={exitGame} /> : gameId === 'case-005' ? <Case005Game onExit={exitGame} /> : gameId === 'case-004' ? <Case004Game onExit={exitGame} /> : <Case002Game onExit={exitGame} />)}"
          assert old_play in component, 'playing anchor not found'
          component = component.replace(old_play, new_play)
          component_path.write_text(component)
          PY

      - name: Validate Super 001 masters
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          paths = sorted(Path('public/game/assets/super-001').glob('*.png'))
          assert len(paths) == 17, f'Expected 17 PNGs, got {len(paths)}'
          for path in paths:
              raw = path.read_bytes()[:24]
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == (1672, 941), (path, width, height)
          print('Super 001: 17/17 PNG masters OK')
          PY

      - run: npm install
      - name: Type check
        run: npm run lint
      - name: Build static site
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add src/game/kidsStory.ts src/components/KidsStoryPrototype.tsx src/components/Super001Game.tsx
          if git diff --cached --quiet; then
            echo "Implementation already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[super-001-code] Make Super 001 playable"
          git push origin HEAD:agent/super-001-assets
