name: Case 005 Integration

on:
  push:
    branches: [agent/case005-unknown-player]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/case005-unknown-player
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Drive auth helper
        run: npm install --no-save --package-lock=false google-auth-library@9
      - name: Import original Case 005 masters
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { GoogleAuth } = require('google-auth-library');
          const files = [
            ['1SoL2XGfFp84CcNzWi7lnypQotY2yN_1-', '00_capa_o_jogador_desconhecido.png'],
            ['11BH8R6yNp4RivMFk_jSJYYQ7k8I3slzD', '01_luna_convite_inesperado.png'],
            ['1BVt_NMX9hAVDct494T58O__jAqsY_l20', '02_maya_informacao_pessoal.png'],
            ['1cB2J_ChlXyQesqm8bCJ_8DZRS2yd86oT', '03_theo_mudar_de_aplicativo.png'],
            ['15R0tr1w8GmAsJ1K3_9j03AEOMITmB11f', '04_nina_colocar_limites.png'],
            ['15hr7nXJnmi2tquegZcQy9k8-P_ap8Ypa', '05_caio_pedido_de_foto.png'],
            ['1uKSQhiuJpa0Ls3cPCBTB_bRSjRbhdXld', '06_luna_escudo_do_jogador.png'],
            ['1gtJ0BTF8SrC0aOIF3XejfWo2NwjAeYMK', '07_final_jogue_proteja_peca_ajuda.png'],
          ];
          async function main() {
            const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const auth = new GoogleAuth({ credentials, scopes: ['https://www.googleapis.com/auth/drive.readonly'] });
            const client = await auth.getClient();
            const access = await client.getAccessToken();
            const token = typeof access === 'string' ? access : access.token;
            if (!token) throw new Error('Could not obtain Drive token');
            const target = path.join('public','game','assets','case-005');
            fs.mkdirSync(target, { recursive: true });
            for (const [id, name] of files) {
              const response = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
              if (!response.ok) throw new Error(`${name}: ${response.status} ${await response.text()}`);
              const buffer = Buffer.from(await response.arrayBuffer());
              fs.writeFileSync(path.join(target, name), buffer);
              console.log(name, buffer.length);
            }
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Validate Case 005 master contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          paths = sorted(Path('public/game/assets/case-005').glob('*.png'))
          assert len(paths) == 8, f'Expected 8 Case 005 PNGs, got {len(paths)}'
          for p in paths:
              raw = p.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', p
              w,h = struct.unpack('>II', raw[16:24])
              assert (w,h) == (1672,941), (p,w,h)
              assert len(raw) > 1_500_000, (p,len(raw))
              print(p.name, w, h, len(raw))
          PY
      - name: Implement Case 005 story and QA
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch marker: {label}')
              return text.replace(old, new, 1)

          story = Path('src/game/kidsStory.ts')
          s = story.read_text()
          s = replace_once(s, "export type KidsGameId = 'case-002' | 'case-004';", "export type KidsGameId = 'case-002' | 'case-004' | 'case-005';", 'KidsGameId')
          marker = "export const kidsGames = [fourthKidsStory, secondKidsStory] as const;"
          fifth = r'''/**
           * Case 005 follows the same gold-standard rhythm while teaching safe online play.
           */
          export const fifthKidsStory = {
            id: 'case-005' as KidsGameId,
            number: '005',
            title: 'O Jogador Desconhecido',
            subtitle: 'Jogue com segurança quando alguém que você não conhece aparece.',
            age: '7–10 anos',
            accent: '#55d8ff',
            cover: '/game/assets/case-005/00_capa_o_jogador_desconhecido.png',
            scenes: {
              warning: '/game/assets/case-005/01_luna_convite_inesperado.png',
              personal: '/game/assets/case-005/02_maya_informacao_pessoal.png',
              app: '/game/assets/case-005/03_theo_mudar_de_aplicativo.png',
              limits: '/game/assets/case-005/04_nina_colocar_limites.png',
              pressure: '/game/assets/case-005/05_caio_pedido_de_foto.png',
              shield: '/game/assets/case-005/06_luna_escudo_do_jogador.png',
              ending: '/game/assets/case-005/07_final_jogue_proteja_peca_ajuda.png',
            },
          } as const;

          export const kidsGames = [fifthKidsStory, fourthKidsStory, secondKidsStory] as const;'''
          s = replace_once(s, marker, fifth, 'fifth story insertion')
          s = replace_once(s, "export const case004Assets = [fourthKidsStory.cover, ...Object.values(fourthKidsStory.scenes)];", "export const case004Assets = [fourthKidsStory.cover, ...Object.values(fourthKidsStory.scenes)];\nexport const case005Assets = [fifthKidsStory.cover, ...Object.values(fifthKidsStory.scenes)];", 'case005 assets')
          s += r'''

          export const playerHabits = [
            { id: 'private', label: 'Proteger informações pessoais', icon: '🛡️', correct: true },
            { id: 'stay', label: 'Não sair do jogo por pressão', icon: '🎮', correct: true },
            { id: 'adult', label: 'Pedir ajuda a um adulto', icon: '🤝', correct: true },
            { id: 'photo', label: 'Mandar foto para agradar', icon: '📸', correct: false },
            { id: 'details', label: 'Passar escola, telefone ou endereço', icon: '🏫', correct: false },
          ] as const;
          '''
          story.write_text(s)

          component = Path('src/components/KidsStoryPrototype.tsx')
          c = component.read_text()
          c = replace_once(c, "  case004Assets,\n  fourthKidsStory,", "  case004Assets,\n  case005Assets,\n  fifthKidsStory,\n  fourthKidsStory,", 'imports assets')
          c = replace_once(c, "  passwordHabits,\n  photoHabits,", "  passwordHabits,\n  photoHabits,\n  playerHabits,", 'imports habits')
          c = replace_once(c, "type Case004Screen = 'warning' | 'clues' | 'principle' | 'permission' | 'risk' | 'shield' | 'ending';", "type Case004Screen = 'warning' | 'clues' | 'principle' | 'permission' | 'risk' | 'shield' | 'ending';\ntype Case005Screen = 'warning' | 'personal' | 'app' | 'limits' | 'pressure' | 'shield' | 'ending';", 'Case005Screen')
          c = replace_once(c, "  const [featuredId, setFeaturedId] = useState<KidsGameId>('case-004');\n  const featured = featuredId === 'case-004' ? fourthKidsStory : secondKidsStory;\n  const featuredLabel = featuredId === 'case-004' ? 'NOVA AVENTURA' : 'HISTÓRIA REFERÊNCIA';", "  const [featuredId, setFeaturedId] = useState<KidsGameId>('case-005');\n  const featured = kidsGames.find(story => story.id === featuredId) ?? kidsGames[0];\n  const featuredLabel = featuredId === 'case-005' ? 'NOVA AVENTURA' : featuredId === 'case-002' ? 'HISTÓRIA REFERÊNCIA' : 'AVENTURA CONTROOLS';", 'featured story logic')
          c = replace_once(c, "        <p>2 histórias jogáveis</p>", "        <p>{kidsGames.length} histórias jogáveis</p>", 'library count')
          c = replace_once(c, "<span><small>{story.id === 'case-004' ? 'NOVA' : 'REFERÊNCIA'}</small><b>{story.title}</b></span>", "<span><small>{story.id === 'case-005' ? 'NOVA' : story.id === 'case-002' ? 'REFERÊNCIA' : 'AVENTURA'}</small><b>{story.title}</b></span>", 'catalog labels')

          case005 = r'''
          function Case005Game({ onExit }: { onExit: () => void }) {
            const [screen, setScreen] = useState<Case005Screen>('warning');
            const [warningAnswer, setWarningAnswer] = useState<'observe' | 'accept' | 'school' | null>(null);
            const [personalAnswer, setPersonalAnswer] = useState<'protect' | 'school' | 'nearby' | null>(null);
            const [appAnswer, setAppAnswer] = useState<'stay' | 'leave' | 'phone' | null>(null);
            const [limitsAnswer, setLimitsAnswer] = useState<'stop' | 'polite' | 'details' | null>(null);
            const [pressureAnswer, setPressureAnswer] = useState<'adult' | 'photo' | 'quick' | null>(null);
            const [habits, setHabits] = useState<string[]>([]);
            const [habitsChecked, setHabitsChecked] = useState(false);
            const shieldSuccess = habits.length === 3 && habits.every(id => playerHabits.find(item => item.id === id)?.correct);

            function toggleHabit(id: string) {
              if (habitsChecked) return;
              setHabits(current => current.includes(id) ? current.filter(item => item !== id) : current.length < 3 ? [...current, id] : current);
            }

            function reset() {
              setScreen('warning');
              setWarningAnswer(null);
              setPersonalAnswer(null);
              setAppAnswer(null);
              setLimitsAnswer(null);
              setPressureAnswer(null);
              setHabits([]);
              setHabitsChecked(false);
            }

            if (screen === 'warning') return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.warning} alt="Luna e a turma recebem um convite de um jogador desconhecido" screen="case005-warning" progress={14} compact>
                <span className="kids3-tag blue">NOVO JOGADOR</span>
                <h1>Alguém desconhecido quer entrar.</h1>
                <p>Ele parece amigável, mas ninguém sabe quem está do outro lado.</p>
                <div className="kids3-choice-grid one">
                  <Choice icon="👀" label="Observar com calma antes de confiar" selected={warningAnswer === 'observe'} onClick={() => setWarningAnswer('observe')} />
                  <Choice icon="⚡" label="Aceitar rápido e conversar" selected={warningAnswer === 'accept'} wrong={warningAnswer === 'accept'} onClick={() => setWarningAnswer('accept')} />
                  <Choice icon="🏫" label="Contar o nome da escola" selected={warningAnswer === 'school'} wrong={warningAnswer === 'school'} onClick={() => setWarningAnswer('school')} />
                </div>
                {warningAnswer && <div className={`kids3-feedback ${warningAnswer === 'observe' ? 'good' : 'hint'}`}><b>{warningAnswer === 'observe' ? 'Boa escolha! 👀' : 'Calma primeiro.'}</b><p>{warningAnswer === 'observe' ? 'Nem todo jogador é quem diz ser. Primeiro observe e proteja suas informações.' : 'Ser educado não significa contar informações pessoais ou confiar rápido.'}</p></div>}
                {warningAnswer === 'observe' && <button className="kids3-primary cyan" type="button" onClick={() => setScreen('personal')}>Ver a próxima mensagem →</button>}
              </Scene>
            );

            if (screen === 'personal') return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.personal} alt="Maya observa uma mensagem perguntando qual escola a turma frequenta" screen="case005-personal" progress={28} compact>
                <span className="kids3-tag blue">PISTA 1</span>
                <h1>“Qual escola você estuda?”</h1>
                <div className="kids3-choice-grid one">
                  <Choice icon="🛡️" label="Prefiro não contar informações pessoais" selected={personalAnswer === 'protect'} onClick={() => setPersonalAnswer('protect')} />
                  <Choice icon="🏫" label="Contar o nome da escola" selected={personalAnswer === 'school'} wrong={personalAnswer === 'school'} onClick={() => setPersonalAnswer('school')} />
                  <Choice icon="📍" label="Dizer que mora perto da escola" selected={personalAnswer === 'nearby'} wrong={personalAnswer === 'nearby'} onClick={() => setPersonalAnswer('nearby')} />
                </div>
                {personalAnswer && <div className={`kids3-feedback ${personalAnswer === 'protect' ? 'good' : 'hint'}`}><b>{personalAnswer === 'protect' ? 'Isso! 🛡️' : 'Essa informação é pessoal.'}</b><p>Escola, endereço, telefone e localização ajudam alguém a descobrir onde você está.</p></div>}
                {personalAnswer === 'protect' && <button className="kids3-primary cyan" type="button" onClick={() => setScreen('app')}>Continuar →</button>}
              </Scene>
            );

            if (screen === 'app') return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.app} alt="Theo compara permanecer no jogo com levar a conversa para outro aplicativo" screen="case005-app" progress={42} compact>
                <span className="kids3-tag blue">PISTA 2</span>
                <h1>“Me chama em outro aplicativo!”</h1>
                <div className="kids3-choice-grid one">
                  <Choice icon="🎮" label="Ficar no ambiente conhecido e falar com um adulto" selected={appAnswer === 'stay'} onClick={() => setAppAnswer('stay')} />
                  <Choice icon="📱" label="Ir para outro aplicativo sem avisar" selected={appAnswer === 'leave'} wrong={appAnswer === 'leave'} onClick={() => setAppAnswer('leave')} />
                  <Choice icon="☎️" label="Passar o número de telefone" selected={appAnswer === 'phone'} wrong={appAnswer === 'phone'} onClick={() => setAppAnswer('phone')} />
                </div>
                {appAnswer && <div className={`kids3-feedback ${appAnswer === 'stay' ? 'good' : 'hint'}`}><b>{appAnswer === 'stay' ? 'Muito bem! 🎮' : 'Sinal de cuidado.'}</b><p>{appAnswer === 'stay' ? 'Pressão para mudar de aplicativo é um bom momento para pedir ajuda.' : 'Não entregue contato pessoal nem saia do ambiente conhecido por pressão.'}</p></div>}
                {appAnswer === 'stay' && <button className="kids3-primary cyan" type="button" onClick={() => setScreen('limits')}>Próxima pista →</button>}
              </Scene>
            );

            if (screen === 'limits') return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.limits} alt="Nina coloca um limite em uma conversa insistente dentro do jogo" screen="case005-limits" progress={56} compact>
                <span className="kids3-tag blue">PISTA 3</span>
                <h1>A conversa começou a incomodar.</h1>
                <div className="kids3-choice-grid one">
                  <Choice icon="✋" label="Parar, bloquear se preciso e pedir ajuda" selected={limitsAnswer === 'stop'} onClick={() => setLimitsAnswer('stop')} />
                  <Choice icon="💬" label="Continuar respondendo por educação" selected={limitsAnswer === 'polite'} wrong={limitsAnswer === 'polite'} onClick={() => setLimitsAnswer('polite')} />
                  <Choice icon="🧾" label="Mandar mais detalhes para explicar" selected={limitsAnswer === 'details'} wrong={limitsAnswer === 'details'} onClick={() => setLimitsAnswer('details')} />
                </div>
                {limitsAnswer && <div className={`kids3-feedback ${limitsAnswer === 'stop' ? 'good' : 'hint'}`}><b>{limitsAnswer === 'stop' ? 'Limite protegido! ✋' : 'Você pode parar.'}</b><p>Você não precisa continuar uma conversa que deixa você desconfortável.</p></div>}
                {limitsAnswer === 'stop' && <button className="kids3-primary cyan" type="button" onClick={() => setScreen('pressure')}>Continuar →</button>}
              </Scene>
            );

            if (screen === 'pressure') return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.pressure} alt="Caio recebe um pedido de foto de um jogador desconhecido" screen="case005-pressure" progress={70} compact>
                <span className="kids3-tag blue">PRESSÃO</span>
                <h1>“Se você é meu amigo, manda uma foto!”</h1>
                <div className="kids3-choice-grid one">
                  <Choice icon="🤝" label="Dizer não, parar e avisar um adulto" selected={pressureAnswer === 'adult'} onClick={() => setPressureAnswer('adult')} />
                  <Choice icon="📸" label="Mandar a foto para não perder o amigo" selected={pressureAnswer === 'photo'} wrong={pressureAnswer === 'photo'} onClick={() => setPressureAnswer('photo')} />
                  <Choice icon="⚡" label="Mandar só uma foto rápida" selected={pressureAnswer === 'quick'} wrong={pressureAnswer === 'quick'} onClick={() => setPressureAnswer('quick')} />
                </div>
                {pressureAnswer && <div className={`kids3-feedback ${pressureAnswer === 'adult' ? 'good' : 'hint'}`}><b>{pressureAnswer === 'adult' ? 'Isso mesmo! 🛡️' : 'Amizade não pressiona.'}</b><p>Quem respeita você não exige foto, segredo ou informação pessoal.</p></div>}
                {pressureAnswer === 'adult' && <button className="kids3-primary cyan" type="button" onClick={() => setScreen('shield')}>Montar o escudo →</button>}
              </Scene>
            );

            if (screen === 'shield') return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.shield} alt="Luna monta um escudo digital com hábitos para jogar com segurança" screen="case005-shield" progress={84} compact>
                <span className="kids3-tag blue">ESCUDO DO JOGADOR</span>
                <h1>Escolha 3 hábitos!</h1>
                <div className="kids3-choice-grid one tiny">
                  {playerHabits.map(item => <Choice key={item.id} icon={item.icon} label={item.label} selected={habits.includes(item.id)} onClick={() => toggleHabit(item.id)} />)}
                </div>
                <div className="kids3-counter"><b>{habits.length}</b><span>/3 hábitos</span></div>
                {!habitsChecked && <button className="kids3-primary cyan" type="button" disabled={habits.length !== 3} onClick={() => setHabitsChecked(true)}>Ativar o escudo 🛡️</button>}
                {habitsChecked && !shieldSuccess && <div className="kids3-feedback hint"><b>O escudo ainda tem uma brecha.</b><p>Proteja seus dados, não ceda à pressão e peça ajuda.</p><button type="button" onClick={() => { setHabits([]); setHabitsChecked(false); }}>Tentar outra vez</button></div>}
                {habitsChecked && shieldSuccess && <><div className="kids3-feedback good"><b>Escudo completo! ✨</b></div><button className="kids3-primary cyan" type="button" onClick={() => setScreen('ending')}>Terminar a partida →</button></>}
              </Scene>
            );

            return (
              <Scene storyTitle={fifthKidsStory.title} src={fifthKidsStory.scenes.ending} alt="A turma comemora depois de bloquear o jogador desconhecido e continuar jogando com segurança" screen="case005-ending" progress={100} compact>
                <span className="kids3-tag blue">PARTIDA SEGURA</span>
                <h1>Missão cumprida!</h1>
                <p><b>Jogue. Proteja. Peça ajuda.</b></p>
                <div className="kids3-badges"><span>🎮<b>Jogador atento</b></span><span>🛡️<b>Dados protegidos</b></span><span>🤝<b>Ajuda quando precisa</b></span></div>
                <button className="kids3-primary cyan" type="button" onClick={reset}>Jogar de novo ↻</button>
                <button className="kids3-secondary" type="button" onClick={onExit}>Voltar ao catálogo</button>
              </Scene>
            );
          }

          '''
          c = replace_once(c, "\nexport default function KidsStoryPrototype()", "\n" + case005 + "export default function KidsStoryPrototype()", 'Case005 component insertion')
          c = replace_once(c, "  const [gameId, setGameId] = useState<KidsGameId>('case-004');", "  const [gameId, setGameId] = useState<KidsGameId>('case-005');", 'initial game')
          c = replace_once(c, "  const activeStory = gameId === 'case-004' ? fourthKidsStory : secondKidsStory;\n  const activeAssets = gameId === 'case-004' ? case004Assets : case002Assets;", "  const activeStory = gameId === 'case-005' ? fifthKidsStory : gameId === 'case-004' ? fourthKidsStory : secondKidsStory;\n  const activeAssets = gameId === 'case-005' ? case005Assets : gameId === 'case-004' ? case004Assets : case002Assets;", 'active story')
          c = replace_once(c, "      {mode === 'playing' && (gameId === 'case-004' ? <Case004Game onExit={exitGame} /> : <Case002Game onExit={exitGame} />)}", "      {mode === 'playing' && (gameId === 'case-005' ? <Case005Game onExit={exitGame} /> : gameId === 'case-004' ? <Case004Game onExit={exitGame} /> : <Case002Game onExit={exitGame} />)}", 'playing dispatch')
          component.write_text(c)

          deploy = Path('.github/workflows/deploy.yml')
          d = deploy.read_text()
          d = replace_once(d, "              'case-004': {'exact': (1672, 941)},", "              'case-004': {'exact': (1672, 941)},\n              'case-005': {'exact': (1672, 941)},", 'deploy contract')
          deploy.write_text(d)

          smoke = Path('tests/qa-smoke.spec.ts')
          q = smoke.read_text()
          q = replace_once(q, "async function startCase004(page: Page) {\n  const card = page.getByRole('button', { name: /jogar a foto que contava demais/i });", "async function startCase005(page: Page) {\n  const card = page.getByRole('button', { name: /jogar o jogador desconhecido/i });\n  await expect(card).toBeVisible();\n  await card.click();\n  await expect(page.locator('[data-screen=\"loading-case-005\"]')).toBeVisible();\n  await expect(page.locator('.kids3-loader-card > strong')).toHaveText('100%', { timeout: 20_000 });\n  await expect(page.locator('[data-screen=\"case005-warning\"]')).toBeVisible({ timeout: 5_000 });\n}\n\nasync function startCase004(page: Page) {\n  await page.getByRole('button', { name: /destacar a foto que contava demais/i }).click();\n  const card = page.getByRole('button', { name: /jogar a foto que contava demais/i });", 'startCase005 helper')
          q = replace_once(q, "test('library exposes Case 004 plus the Case 002 reference story'", "test('library exposes Case 005, Case 004 and the Case 002 reference story'", 'library test title')
          q = replace_once(q, "  await expect(page.getByRole('button', { name: /jogar a foto que contava demais/i })).toBeVisible();", "  await expect(page.getByRole('button', { name: /jogar o jogador desconhecido/i })).toBeVisible();\n  await expect(page.getByRole('button', { name: /destacar o jogador desconhecido/i })).toBeVisible();", 'library featured')
          q = replace_once(q, "  await expect(page.locator('.kids3-catalog-tile')).toHaveCount(2);", "  await expect(page.locator('.kids3-catalog-tile')).toHaveCount(3);", 'catalog count smoke')
          case005tests = r'''
          test('Case 005 preloads all eight full-resolution assets before gameplay', async ({ page }) => {
            await page.setViewportSize({ width: 1280, height: 650 });
            await page.goto('/pt/');
            await startCase005(page);
            const resources = await page.evaluate(() => performance.getEntriesByType('resource').map(entry => entry.name).filter(name => name.includes('/game/assets/case-005/')));
            expect(new Set(resources).size).toBeGreaterThanOrEqual(8);
            await expectFullScreenScene(page, 'case005-warning', /\/game\/assets\/case-005\/01_luna_convite_inesperado\.png$/);
          });

          test('Case 005 completes the gold-standard seven-beat learning arc', async ({ page }) => {
            await page.setViewportSize({ width: 1280, height: 650 });
            await page.goto('/pt/');
            await startCase005(page);
            await page.getByRole('button', { name: /observar com calma antes de confiar/i }).click();
            await page.getByRole('button', { name: /ver a próxima mensagem/i }).click();
            await expectFullScreenScene(page, 'case005-personal', /02_maya_informacao_pessoal\.png$/);
            await page.getByRole('button', { name: /prefiro não contar informações pessoais/i }).click();
            await page.getByRole('button', { name: /continuar/i }).click();
            await expectFullScreenScene(page, 'case005-app', /03_theo_mudar_de_aplicativo\.png$/);
            await page.getByRole('button', { name: /ficar no ambiente conhecido e falar com um adulto/i }).click();
            await page.getByRole('button', { name: /próxima pista/i }).click();
            await expectFullScreenScene(page, 'case005-limits', /04_nina_colocar_limites\.png$/);
            await page.getByRole('button', { name: /parar, bloquear se preciso e pedir ajuda/i }).click();
            await page.getByRole('button', { name: /continuar/i }).click();
            await expectFullScreenScene(page, 'case005-pressure', /05_caio_pedido_de_foto\.png$/);
            await page.getByRole('button', { name: /dizer não, parar e avisar um adulto/i }).click();
