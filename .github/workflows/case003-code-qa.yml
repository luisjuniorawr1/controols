name: Case 003 Implementation QA

on:
  push:
    branches: [feature/case003-link-fantasma]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Case 003 implementation patch
        run: python scripts/patch-case003.py
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "Implementation already present"
          else
            git config user.name "controols-qa-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/components/KidsStoryPrototype.tsx tests/qa-smoke.spec.ts
            git commit -m "Build Case 003 Link Fantasma game flow"
            git push origin HEAD:feature/case003-link-fantasma
          fi
      - run: npm install
      - name: Validate Case 003 masters
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          paths = sorted(Path('public/game/assets/case-003').glob('*.png'))
          assert len(paths) == 8
          for path in paths:
              raw = path.read_bytes()[:24]
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == (1672, 941), (path, width, height)
          PY
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke QA all three cases
        run: npm run qa:smoke
