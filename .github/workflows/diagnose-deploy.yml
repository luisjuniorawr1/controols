# Temporary utility workflow — do not merge.
name: Export Case 004 cover

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload current Case 004 cover
        uses: actions/upload-artifact@v4
        with:
          name: case004-cover-source
          path: public/game/assets/case-004/00_capa_a_foto_que_contava_demais.png
          if-no-files-found: error
          retention-days: 1
