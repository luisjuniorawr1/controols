name: Case 003 Drive Bridge Email

on:
  push:
    branches: [fix/case003-real-link-assets-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expose-service-account-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write service account email only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import json, os
          data = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          email = data['client_email']
          os.makedirs('tmp', exist_ok=True)
          with open('tmp/service-account-email.txt','w') as f:
              f.write(email + '\n')
          PY
      - name: Commit email helper
        run: |
          git config user.name "controols-asset-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/service-account-email.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose service account email for Case 003 asset bridge"
          git push origin HEAD:fix/case003-real-link-assets-v2
