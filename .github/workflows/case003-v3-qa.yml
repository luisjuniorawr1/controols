name: Case 003 V3 QA

on:
  push:
    branches: [fix/case003-true-story-assets-v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate corrected Case 003 masters
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          folder = Path('public/game/assets/case-003')
          expected = [
              '00_capa_link_fantasma.png',
              '01_luna_link_suspeito.png',
              '02_maya_pistas_link.png',
              '03_endereco_suspeito.png',
              '04_nina_caminho_oficial.png',
              '05_caio_pagina_pede_codigo.png',
              '06_luna_mapa_link_seguro.png',
              '07_final_link_desmascarado.png',
          ]
          paths = sorted(folder.glob('*.png'))
          assert [p.name for p in paths] == expected, [p.name for p in paths]
          for path in paths:
              raw = path.read_bytes()[:24]
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              w, h = struct.unpack('>II', raw[16:24])
              assert (w, h) == (1672, 941), (path, w, h)
              assert path.stat().st_size > 700_000, (path, path.stat().st_size)
              print(path.name, w, h, path.stat().st_size)
          story = Path('src/game/kidsStory.ts').read_text()
          assert "CASE003_ASSET_VERSION = 'v3-20260817'" in story
          assert "case003Asset('01_luna_link_suspeito.png')" in story
          PY
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke QA all games
        run: npm run qa:smoke
