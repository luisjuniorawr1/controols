name: Case 004 Asset Import

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/case004-photo-privacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Drive auth helper
        run: npm install --no-save --package-lock=false google-auth-library@9
      - name: Download original 1672x941 PNG masters
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { GoogleAuth } = require('google-auth-library');

          const files = [
            ['1BPnqdNj0ChlZ20DAyuJSQV0UCle9nuQY', '00_capa_a_foto_que_contava_demais.png'],
            ['1AgVjEbS7rjEsepE8A3jr6c3v-a9ZJD4w', '01_luna_foto_conta_demais.png'],
            ['1yDFOuAoaAAQowKa7f1QPaX7j6HU0fcXX', '02_maya_pistas_da_foto.png'],
            ['1_rw_ApuqvSlGZ_LOrNrvC6NowNCIDBhw', '03_theo_foto_segura.png'],
            ['1rTbzcbM6KvfVtaJzt41ovHQKa0_iV0wz', '04_nina_pedir_permissao.png'],
            ['1yquPNe_M1aUbADqnUMnzoeVqp3t3bywO', '05_caio_mensagem_invasiva.png'],
            ['1Qb7k-_j3IKSljUtLTuGXup4b5H85c1-h', '06_luna_escudo_da_foto.png'],
            ['1wv6R1k3wVSVqvoO0sRvndPZrhmPwfjwu', '07_final_foto_protegida.png'],
          ];

          async function main() {
            const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const auth = new GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/drive.readonly'],
            });
            const client = await auth.getClient();
            const access = await client.getAccessToken();
            const token = typeof access === 'string' ? access : access.token;
            if (!token) throw new Error('Could not obtain Google access token');

            const target = path.join('public', 'game', 'assets', 'case-004');
            fs.mkdirSync(target, { recursive: true });

            for (const [id, name] of files) {
              const response = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!response.ok) throw new Error(`${name}: Drive download failed ${response.status} ${await response.text()}`);
              const buffer = Buffer.from(await response.arrayBuffer());
              fs.writeFileSync(path.join(target, name), buffer);
              console.log(name, buffer.length);
            }
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Validate exact PNG master contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          folder = Path('public/game/assets/case-004')
          paths = sorted(folder.glob('*.png'))
          assert len(paths) == 8, f'Expected 8 PNGs, got {len(paths)}'
          for p in paths:
              raw = p.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', p
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == (1672, 941), (p, width, height)
              assert len(raw) > 1_500_000, (p, len(raw))
              print(p.name, width, height, len(raw))
          PY
      - name: Commit masters to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game/assets/case-004
          if git diff --cached --quiet; then
            echo "Case 004 masters already committed"
          else
            git commit -m "Add original Case 004 photo privacy masters"
            git push origin HEAD:agent/case004-photo-privacy
          fi
