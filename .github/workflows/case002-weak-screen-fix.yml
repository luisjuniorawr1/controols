name: Case 002 Weak Screen Fix

on:
  push:
    branches: [fix/case002-weak-password-image-alignment]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align Case 002 weak-password screen with its artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('src/components/KidsStoryPrototype.tsx')
          text = component.read_text()
          replacements = [
              ('<h1>Qual é fácil de adivinhar?</h1>', '<h1>Qual senha é fácil de adivinhar?</h1>'),
              ('<Choice label="Nuvem Salta Sobre 4 Luas" selected={weakAnswer === \'long1\'} wrong={weakAnswer === \'long1\'} onClick={() => setWeakAnswer(\'long1\')} />', '<Choice label="Bolo com 3 Velas" selected={weakAnswer === \'long1\'} wrong={weakAnswer === \'long1\'} onClick={() => setWeakAnswer(\'long1\')} />'),
              ('<Choice label="Pato Roxo Viaja 27" selected={weakAnswer === \'long2\'} wrong={weakAnswer === \'long2\'} onClick={() => setWeakAnswer(\'long2\')} />', '<Choice label="3 Chaves Douradas" selected={weakAnswer === \'long2\'} wrong={weakAnswer === \'long2\'} onClick={() => setWeakAnswer(\'long2\')} />'),
              ('className={`kids3-feedback ${weakAnswer === \'easy\' ? \'good\' : \'hint\'}`}', 'className={`kids3-feedback case002-weak-feedback ${weakAnswer === \'easy\' ? \'good\' : \'hint\'}`}'),
              ('Sequências muito comuns são fáceis de tentar.', '123456 é uma sequência muito comum e fácil de tentar.'),
              ('Uma frase longa costuma ser mais difícil de adivinhar.', 'Pense nas três pistas da imagem: a sequência de números é a mais óbvia.'),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)
          component.write_text(text)

          css = Path('app/kids-right-panel-readable.css')
          css_text = css.read_text()
          marker = '/* Case 002 · Pista 1: feedback follows the same centered rail as the answer options. */'
          if marker not in css_text:
              css_block = '\n'.join([
                  marker,
                  '[data-screen="case002-weak"] .case002-weak-feedback {',
                  '  width: 100%;',
                  '  max-width: none;',
                  '  min-height: clamp(72px, 10vh, 92px);',
                  '  margin-inline: auto;',
                  '  box-sizing: border-box;',
                  '  display: flex;',
                  '  flex-direction: column;',
                  '  align-items: center;',
                  '  justify-content: center;',
                  '  text-align: center;',
                  '}',
                  '[data-screen="case002-weak"] .case002-weak-feedback > b,',
                  '[data-screen="case002-weak"] .case002-weak-feedback > p {',
                  '  width: 100%;',
                  '  margin-inline: auto !important;',
                  '  text-align: center;',
                  '}',
                  '[data-screen="case002-weak"] .case002-weak-feedback > p {',
                  '  max-width: 32ch;',
                  '}',
                  '@media (min-width: 761px) and (max-height: 700px) {',
                  '  [data-screen="case002-weak"] .case002-weak-feedback {',
                  '    min-height: 76px;',
                  '  }',
                  '}',
              ])
              css.write_text(css_text.rstrip() + '\n\n' + css_block + '\n')
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "Patch already present"
          else
            git config user.name "controols-qa-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/components/KidsStoryPrototype.tsx app/kids-right-panel-readable.css
            git commit -m "Align Case 002 weak-password clues with artwork"
            git push origin HEAD:fix/case002-weak-password-image-alignment
          fi
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Install Chromium for smoke QA
        run: npx playwright install --with-deps chromium
      - name: Smoke test game flow and Case 002 clue alignment
        run: npm run qa:smoke
