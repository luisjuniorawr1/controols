name: Build, Smoke QA and Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: controols-main-build
  cancel-in-progress: true

jobs:
  build-qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare real Case 001 artwork
        run: |
          test -f asset-packs/controols-assets-v2.zip
          rm -rf public/game/assets/v2-real
          mkdir -p public/game/assets/v2-real /tmp/controols-assets-v2
          unzip -q asset-packs/controols-assets-v2.zip -d /tmp/controols-assets-v2
          cp /tmp/controols-assets-v2/controols-assets-v2/scenes/*.png public/game/assets/v2-real/
          test "$(find public/game/assets/v2-real -maxdepth 1 -name '*.png' | wc -l)" -eq 8
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Install Chromium for smoke QA
        run: npx playwright install --with-deps chromium
      - name: Smoke test critical game flow
        run: npm run qa:smoke
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controols-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: ${{ success() && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: controols
