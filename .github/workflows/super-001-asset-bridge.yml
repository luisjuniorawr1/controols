name: Temporary Super 001 Asset Bridge

on:
  push:
    branches: [agent/super-001-assets]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  asset-bridge:
    if: ${{ !contains(github.event.head_commit.message, '[super-001-asset-bridge]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DRIVE_FILE_ID: 1DQ0ksHrgelA-78eVhS3B6R_U71-l6-9B
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/super-001-assets
          fetch-depth: 0

      - name: Mint Google Drive access token
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/drive-token
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const creds = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!creds.client_email || !creds.private_key) throw new Error('service account credentials incomplete');
          console.error(`Drive service account: ${creds.client_email}`);
          const now = Math.floor(Date.now() / 1000);
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const unsigned = `${b64({alg:'RS256',typ:'JWT'})}.${b64({
            iss:creds.client_email,
            scope:'https://www.googleapis.com/auth/drive.readonly',
            aud:'https://oauth2.googleapis.com/token',
            iat:now,
            exp:now+3600
          })}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), creds.private_key).toString('base64url');
          const response = execFileSync('curl', [
            '--fail','--silent','--show-error',
            '--data-urlencode','grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer',
            '--data-urlencode',`assertion=${unsigned}.${signature}`,
            'https://oauth2.googleapis.com/token'
          ], {encoding:'utf8'});
          const token = JSON.parse(response).access_token;
          if (!token) throw new Error('access token missing');
          process.stdout.write(token);
          NODE
          DRIVE_ACCESS_TOKEN=$(cat /tmp/drive-token)
          echo "::add-mask::${DRIVE_ACCESS_TOKEN}"
          echo "DRIVE_ACCESS_TOKEN=${DRIVE_ACCESS_TOKEN}" >> "$GITHUB_ENV"
          rm -f /tmp/drive-token

      - name: Download validated Super 001 asset pack from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/super-001
          OUT=/tmp/super-001/assets.zip
          status=$(curl --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer ${DRIVE_ACCESS_TOKEN}" \
            -o "$OUT" -w '%{http_code}' \
            "https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media" || true)
          echo "Drive API download: HTTP ${status}."
          test "$status" = "200"
          unzip -tq "$OUT" >/dev/null

      - name: Install and validate 17 PNG masters
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/super-001/unpacked
          mkdir -p /tmp/super-001/unpacked public/game/assets/super-001
          unzip -q /tmp/super-001/assets.zip -d /tmp/super-001/unpacked
          cp /tmp/super-001/unpacked/super-001/*.png public/game/assets/super-001/
          python - <<'PY'
          from pathlib import Path
          import json, struct, hashlib

          folder = Path('public/game/assets/super-001')
          manifest = json.loads((folder / 'manifest.json').read_text())
          expected = {item['file']: item for item in manifest['assets']}
          paths = sorted(folder.glob('*.png'))
          assert len(paths) == 17, f'Expected 17 PNGs, got {len(paths)}'
          assert {p.name for p in paths} == set(expected), 'Asset filenames do not match manifest'
          for path in paths:
              raw = path.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', raw[16:24])
              assert (width, height) == (1672, 941), (path, width, height)
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == expected[path.name]['sha256'], (path, digest)
              print(path.name, width, height, len(raw), digest[:12])
          PY

      - name: Commit exact PNG masters to branch
        shell: bash
        run: |
          set -euo pipefail
          git add public/game/assets/super-001
          if git diff --cached --quiet; then
            echo "Super 001 assets already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[super-001-asset-bridge] Add Super 001 PNG masters"
          git push origin HEAD:agent/super-001-assets
