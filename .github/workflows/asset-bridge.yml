name: Finalize original asset migration

on:
  push:
    branches: [fix-game-asset-quality]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch game to original PNG masters
        run: |
          set -euo pipefail

          test "$(stat -c%s public/game/assets/characters/luna.png)" -eq 1045406
          test "$(stat -c%s public/game/assets/characters/theo.png)" -eq 905391
          test "$(stat -c%s public/game/assets/characters/maya.png)" -eq 902794
          test "$(stat -c%s public/game/assets/characters/caio.png)" -eq 927304
          test "$(stat -c%s public/game/assets/characters/nina.png)" -eq 971974
          test "$(stat -c%s public/game/assets/reference/character-lineup.png)" -eq 1785718
          test "$(stat -c%s public/game/assets/scenes/title-a-mensagem-misteriosa.png)" -eq 2303570
          test "$(stat -c%s public/game/assets/scenes/mensagem-suspeita.png)" -eq 2108740
          test "$(stat -c%s public/game/assets/scenes/quadro-de-pistas.png)" -eq 2049145
          test "$(stat -c%s public/game/assets/ui/reward-icons-sheet.png)" -eq 1449264

          sed -i 's/\.webp/\.png/g' src/game/kidsStory.ts src/components/KidsStoryPrototype.tsx

          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete p.scripts['assets:game'];
          delete p.scripts.predev;
          delete p.scripts.prebuild;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

          cat > public/game/assets/README.md <<'EOF'
          # CONTROOLS game assets

          Os arquivos desta pasta são os **masters oficiais em resolução original** do CONTROOLS para crianças de 7 a 10 anos.

          ## Regra de qualidade

          - Não reduzir resolução antes de publicar.
          - Não converter os masters para formatos com perda.
          - A interface pode redimensionar a exibição via CSS, mas deve carregar o master original.
          - Novos assets devem entrar no repositório na resolução original em que forem aprovados.

          ## Elenco oficial

          - Luna — amarelo, cachos e presilha de estrela.
          - Theo — turquesa, óculos e acessórios de tecnologia.
          - Maya — roxo, tranças e tablet/caderno.
          - Caio — laranja/vermelho, energético.
          - Nina — verde, calma e bolsa com escudo.

          Novas cenas devem preservar rosto, cabelo, roupas, cores e acessórios desses personagens.

          ## Masters atuais

          - Personagens: 1122 × 1402 px.
          - Cenas 16:9: 1672 × 941 px.
          - Lineup e folha de recompensas: 1448 × 1086 px.

          A primeira aventura é **A Mensagem Misteriosa** e privilegia imagens, escolhas curtas e cooperação.
          EOF

          cat > tests/qa-smoke.spec.ts <<'EOF'
          import { expect, test } from '@playwright/test';

          async function expectSceneMaster(image: ReturnType<Parameters<typeof expect>[0] extends never ? never : never>) {}

          test('kids title screen loads original-resolution artwork and play modes', async ({ page }) => {
            await page.goto('/pt/');
            const art = page.getByRole('img', { name: /luna, theo, maya, caio e nina/i });
            await expect(art).toBeVisible();
            await expect(page.getByRole('button', { name: /1 jogador/i })).toBeVisible();
            await expect(page.getByRole('button', { name: /2 jogadores/i })).toBeVisible();
            await expect.poll(async () => art.evaluate((img: HTMLImageElement) => img.naturalWidth)).toBeGreaterThanOrEqual(1600);
            await expect.poll(async () => art.evaluate((img: HTMLImageElement) => img.naturalHeight)).toBeGreaterThanOrEqual(900);
          });

          test('one-player flow uses full-resolution character and scene masters', async ({ page }) => {
            await page.goto('/pt/');
            await page.getByRole('button', { name: /1 jogador/i }).click();
            const luna = page.getByRole('img', { name: 'Luna', exact: true });
            await expect(luna).toBeVisible();
            await expect.poll(async () => luna.evaluate((img: HTMLImageElement) => img.naturalWidth)).toBeGreaterThanOrEqual(1100);
            await expect.poll(async () => luna.evaluate((img: HTMLImageElement) => img.naturalHeight)).toBeGreaterThanOrEqual(1400);
            await page.getByRole('button', { name: /começar aventura/i }).click();
            const scene = page.getByRole('img', { name: /mensagem suspeita do clube aurora/i });
            await expect(scene).toBeVisible();
            await expect.poll(async () => scene.evaluate((img: HTMLImageElement) => img.naturalWidth)).toBeGreaterThanOrEqual(1600);
            await expect.poll(async () => scene.evaluate((img: HTMLImageElement) => img.naturalHeight)).toBeGreaterThanOrEqual(900);
            await page.getByRole('button', { name: /procurar pistas/i }).click();
            const clues = page.getByRole('img', { name: /quadro colorido com pistas/i });
            await expect(clues).toBeVisible();
            await expect.poll(async () => clues.evaluate((img: HTMLImageElement) => img.naturalWidth)).toBeGreaterThanOrEqual(1600);
            await expect.poll(async () => clues.evaluate((img: HTMLImageElement) => img.naturalHeight)).toBeGreaterThanOrEqual(900);
          });

          test('two-player selection keeps five official characters and original masters on mobile', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('/pt/');
            await page.getByRole('button', { name: /2 jogadores/i }).click();
            const cards = page.getByTestId('character-grid').locator('button');
            await expect(cards).toHaveCount(5);
            await expect(page.getByTestId('character-grid').locator('.is-selected')).toHaveCount(2);
            const firstImage = cards.first().locator('img');
            await expect.poll(async () => firstImage.evaluate((img: HTMLImageElement) => img.naturalWidth)).toBeGreaterThanOrEqual(1100);
            await expect.poll(async () => firstImage.evaluate((img: HTMLImageElement) => img.naturalHeight)).toBeGreaterThanOrEqual(1400);
            await expect(page.getByRole('button', { name: /começar aventura/i })).toBeEnabled();
          });
          EOF

          # Remove the old build-time image materializer and this one-time bridge itself.
          git rm scripts/materialize-game-assets.mjs
          git rm .github/workflows/asset-bridge.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/game/kidsStory.ts src/components/KidsStoryPrototype.tsx tests/qa-smoke.spec.ts public/game/assets/README.md
          git commit -m 'Use original-resolution game artwork'
          git push
