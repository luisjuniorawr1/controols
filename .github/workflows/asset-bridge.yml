name: Temporary Asset Bridge

on:
  push:
    branches: [fix/use-real-v2-png-assets]

permissions:
  contents: write

jobs:
  asset-bridge:
    if: ${{ !contains(github.event.head_commit.message, '[asset-bridge]') }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DRIVE_FILE_ID: 1isC9B9RXhwMF5YNb7KOTNEuptI5RcPaj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint Drive access token with service-account key
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const creds = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!creds.client_email || !creds.private_key) throw new Error('service account credentials incomplete');
          const now = Math.floor(Date.now() / 1000);
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const unsigned = `${b64({alg:'RS256',typ:'JWT'})}.${b64({
            iss: creds.client_email,
            scope: 'https://www.googleapis.com/auth/drive.readonly',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          })}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), creds.private_key).toString('base64url');
          fs.writeFileSync('/tmp/google-assertion.jwt', `${unsigned}.${signature}`);
          NODE
          curl --fail --silent --show-error \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$(cat /tmp/google-assertion.jwt)" \
            https://oauth2.googleapis.com/token > /tmp/google-token.json
          node - <<'NODE'
          const fs = require('fs');
          const token = JSON.parse(fs.readFileSync('/tmp/google-token.json', 'utf8'));
          if (!token.access_token) throw new Error('access token missing');
          console.log(`::add-mask::${token.access_token}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `DRIVE_ACCESS_TOKEN=${token.access_token}\n`);
          NODE
          rm -f /tmp/google-assertion.jwt /tmp/google-token.json

      - name: Download master asset pack from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/controols-assets
          OUT=/tmp/controols-assets/controols-assets-v2.zip
          URLS=(
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=${DRIVE_FILE_ID}&confirm=t"
            "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&authuser=0&confirm=t"
          )
          ok=0
          for url in "${URLS[@]}"; do
            rm -f "$OUT"
            status=$(curl --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer ${DRIVE_ACCESS_TOKEN}" \
              -o "$OUT" -w '%{http_code}' "$url" || true)
            echo "Drive download endpoint returned HTTP ${status}."
            if [ "$status" = "200" ] && unzip -tq "$OUT" >/dev/null 2>&1; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          test -s "$OUT"

      - name: Install real Case 001 PNG masters
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/game/assets/v2-real /tmp/controols-assets/unpacked
          mkdir -p public/game/assets/v2-real /tmp/controols-assets/unpacked
          unzip -q /tmp/controols-assets/controols-assets-v2.zip -d /tmp/controols-assets/unpacked
          cp /tmp/controols-assets/unpacked/controols-assets-v2/scenes/*.png public/game/assets/v2-real/
          test "$(find public/game/assets/v2-real -maxdepth 1 -name '*.png' | wc -l)" -eq 8

      - name: Validate PNG master dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          paths = sorted(Path('public/game/assets/v2-real').glob('*.png'))
          assert len(paths) == 8, len(paths)
          for path in paths:
              raw = path.read_bytes()[:24]
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', raw[16:24])
              print(path.name, width, height)
              assert width >= 1600 and height >= 900, (path, width, height)
          PY

      - name: Commit PNG masters to branch
        shell: bash
        run: |
          set -euo pipefail
          git add public/game/assets/v2-real
          if git diff --cached --quiet; then
            echo "Assets already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[asset-bridge] Add real Case 001 PNG assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
