name: Temporary Case 001 QA

on:
  push:
    branches: [fix/use-real-v2-png-assets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate committed Case 001 PNG masters
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          paths = sorted(Path('public/game/assets/v2-real').glob('*.png'))
          assert len(paths) == 8, f'Expected 8 PNGs, got {len(paths)}'
          for path in paths:
              raw = path.read_bytes()[:24]
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', raw[16:24])
              print(path.name, width, height)
              assert width >= 1600 and height >= 900, (path, width, height)
          PY
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Install Chromium for smoke QA
        run: npx playwright install --with-deps chromium
      - name: Smoke test critical game flow
        run: npm run qa:smoke
