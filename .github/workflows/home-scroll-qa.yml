name: Homepage Scroll QA

on:
  push:
    branches: [agent/home-scroll-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify physical public scrolling and game lock
        run: |
          python3 -m http.server 4173 --directory out >/tmp/controols-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const publicState = await page.evaluate(() => ({ scrollHeight: document.documentElement.scrollHeight, innerHeight, htmlOverflowY: getComputedStyle(document.documentElement).overflowY, bodyOverflowY: getComputedStyle(document.body).overflowY }));
            if (publicState.scrollHeight <= publicState.innerHeight) throw new Error(`Homepage does not extend beyond viewport: ${JSON.stringify(publicState)}`);
            if (publicState.htmlOverflowY === 'hidden' && publicState.bodyOverflowY === 'hidden') throw new Error(`Homepage is still physically scroll-locked: ${JSON.stringify(publicState)}`);
            await page.mouse.wheel(0, 900);
            await page.waitForTimeout(150);
            const y = await page.evaluate(() => window.scrollY);
            if (y < 100) throw new Error(`Mouse/touch-style scrolling did not move the homepage: scrollY=${y}, state=${JSON.stringify(publicState)}`);

            await page.goto('http://127.0.0.1:4173/pt/', { waitUntil: 'networkidle' });
            const gameState = await page.evaluate(() => ({ scrollHeight: document.documentElement.scrollHeight, innerHeight, htmlOverflowY: getComputedStyle(document.documentElement).overflowY, bodyOverflowY: getComputedStyle(document.body).overflowY }));
            await page.mouse.wheel(0, 500);
            await page.waitForTimeout(150);
            const gameY = await page.evaluate(() => window.scrollY);
            if (gameY !== 0) throw new Error(`Game route unexpectedly scrolls: scrollY=${gameY}, state=${JSON.stringify(gameState)}`);
            console.log({ publicState, y, gameState, gameY });
            await browser.close();
          })();
          NODE
