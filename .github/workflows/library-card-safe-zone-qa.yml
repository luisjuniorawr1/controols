name: Library Card Safe Zone QA

on:
  push:
    branches: [fix/library-cards-right-safe-zone]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move adventure card interaction into the right safe zone
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('app/kids-right-panel-readable.css')
          css = css_path.read_text()
          css_marker = '/* Library cards: reserve the artwork safe zone on the right for title and play action. */'
          if css_marker not in css:
              css += r'''

/* Library cards: reserve the artwork safe zone on the right for title and play action. */
@media (min-width: 761px) {
  .kids3-game-card-shade {
    background:
      linear-gradient(90deg, rgba(4,14,35,.03) 0 46%, rgba(4,14,35,.28) 60%, rgba(4,14,35,.82) 100%),
      linear-gradient(0deg, rgba(4,14,35,.34) 0%, rgba(4,14,35,.08) 48%, transparent 72%);
  }
  .kids3-game-card > div {
    left: auto;
    right: clamp(20px, 2.2vw, 32px);
    top: 50%;
    bottom: auto;
    transform: translateY(-50%);
    width: clamp(210px, 42%, 285px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(5px, .8vh, 9px);
    text-align: right;
  }
  .kids3-game-card small,
  .kids3-game-card h2,
  .kids3-game-card p {
    width: 100%;
    text-align: right;
  }
  .kids3-game-card h2 {
    font-size: clamp(23px, 3.8vh, 34px);
    line-height: .96;
    text-wrap: balance;
  }
  .kids3-game-card p {
    max-width: 28ch;
    font-size: clamp(13px, 1.95vh, 17px);
    line-height: 1.12;
  }
  .kids3-game-card div > b {
    justify-self: auto;
    align-self: flex-end;
    margin-top: clamp(5px, .8vh, 9px);
    padding: 9px 18px;
    font-size: clamp(14px, 2vh, 17px);
  }
}

@media (min-width: 761px) and (max-height: 700px) {
  .kids3-game-card > div {
    right: 22px;
    width: 43%;
    gap: 4px;
  }
  .kids3-game-card h2 { font-size: 24px; }
  .kids3-game-card p { font-size: 13px; }
  .kids3-game-card div > b { font-size: 14px; padding: 8px 16px; }
}
'''
              css_path.write_text(css)

          test_path = Path('tests/qa-right-panel.spec.ts')
          test = test_path.read_text()
          test_marker = "test('library cards keep title and play action inside the artwork right safe zone'"
          if test_marker not in test:
              test += r'''

test('library cards keep title and play action inside the artwork right safe zone', async ({ page }) => {
  await page.setViewportSize({ width: 1280, height: 650 });
  await page.goto('/pt/');

  const cards = page.locator('.kids3-game-card');
  await expect(cards).toHaveCount(2);

  const metrics = await cards.evaluateAll((nodes) => nodes.map((node) => {
    const card = node as HTMLElement;
    const content = card.querySelector(':scope > div') as HTMLElement | null;
    const title = card.querySelector('h2') as HTMLElement | null;
    const play = card.querySelector(':scope > div > b') as HTMLElement | null;
    if (!content || !title || !play) throw new Error('library card content missing');
    const c = card.getBoundingClientRect();
    const box = content.getBoundingClientRect();
    const button = play.getBoundingClientRect();
    return {
      cardLeft: c.left,
      cardRight: c.right,
      cardWidth: c.width,
      contentLeft: box.left,
      contentRight: box.right,
      buttonRight: button.right,
      titleAlign: getComputedStyle(title).textAlign,
      contentAlign: getComputedStyle(content).textAlign,
    };
  }));

  for (const card of metrics) {
    expect(card.contentLeft).toBeGreaterThanOrEqual(card.cardLeft + card.cardWidth * .54);
    expect(card.contentRight).toBeLessThanOrEqual(card.cardRight - 15);
    expect(Math.abs(card.contentRight - card.buttonRight)).toBeLessThanOrEqual(2);
    expect(card.titleAlign).toBe('right');
    expect(card.contentAlign).toBe('right');
  }
});
'''
              test_path.write_text(test)
          PY
      - name: Commit card layout patch when needed
        run: |
          if git diff --quiet; then
            echo "Patch already present"
          else
            git config user.name "controols-qa-bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/kids-right-panel-readable.css tests/qa-right-panel.spec.ts
            git commit -m "Use the right safe zone in adventure cards"
            git push origin HEAD:fix/library-cards-right-safe-zone
          fi
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Install Chromium for smoke QA
        run: npx playwright install --with-deps chromium
      - name: Smoke test game flow and library card safe zone
        run: npm run qa:smoke
