name: Export Character References

on:
  push:
    branches: [agent/export-character-refs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: controols-character-refs
          path: |
            public/game/assets/characters/*.png
            public/game/assets/reference/character-lineup.png
            public/game/assets/v2-real/*.png
          if-no-files-found: error
