name: Import cleaned Case 004 cover

on:
  pull_request:
    paths:
      - '.github/workflows/import-case004-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DRIVE_FILE_ID: 1MUYbfc-kfXGWk-cxj3casAz1WLSseFhv
      TARGET: public/game/assets/case-004/00_capa_a_foto_que_contava_demais.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case004-clean-art-upload
          fetch-depth: 0

      - name: Download edited cover from Drive
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const b64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = b64url(JSON.stringify({
            iss: sa.client_email,
            scope: 'https://www.googleapis.com/auth/drive.readonly',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          }));
          const unsigned = `${header}.${payload}`;
          const signer = crypto.createSign('RSA-SHA256');
          signer.update(unsigned);
          signer.end();
          const assertion = `${unsigned}.${signer.sign(sa.private_key).toString('base64url')}`;

          (async () => {
            const body = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion,
            });
            const tr = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body,
            });
            if (!tr.ok) throw new Error(`OAuth failed: ${tr.status} ${await tr.text()}`);
            const accessToken = (await tr.json()).access_token;
            const fr = await fetch(`https://www.googleapis.com/drive/v3/files/${process.env.DRIVE_FILE_ID}?alt=media`, {
              headers: { authorization: `Bearer ${accessToken}` },
            });
            if (!fr.ok) throw new Error(`Drive download failed: ${fr.status} ${await fr.text()}`);
            const buf = Buffer.from(await fr.arrayBuffer());
            fs.writeFileSync(process.env.TARGET, buf);
            console.log(`Downloaded ${buf.length} bytes to ${process.env.TARGET}`);
          })().catch(err => { console.error(err.stack || String(err)); process.exit(1); });
          NODE

      - name: Validate edited PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path('public/game/assets/case-004/00_capa_a_foto_que_contava_demais.png')
          raw = p.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', raw[16:24])
          assert (width, height) == (1672, 941), (width, height)
          assert len(raw) > 1_500_000, len(raw)
          print(width, height, len(raw))
          PY

      - name: Commit edited artwork to branch
        shell: bash
        run: |
          if git diff --quiet -- "$TARGET"; then
            echo 'Artwork already matches; nothing to commit.'
            exit 0
          fi
          git config user.name 'CONTROOLS Asset Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Replace Case 004 cover with text-free artwork'
          git push origin HEAD:case004-clean-art-upload
