name: Temporary Verified Live Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-1GTDJXPQZC
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Confirm Firebase credentials
        run: test -n "$FIREBASE_SERVICE_ACCOUNT"
      - name: Deploy current main content to Firebase live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: controols
